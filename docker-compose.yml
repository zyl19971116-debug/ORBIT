services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: orbit, POSTGRES_PASSWORD: orbit, POSTGRES_DB: orbit }
    ports: ["5432:5432"]
    volumes: ["orbit-postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["orbit-redis:/data"]
volumes: { orbit-postgres: {}, orbit-redis: {} }
